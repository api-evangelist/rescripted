name: Rescripted
description: >-
  Rescripted is a digital women's health platform dedicated to empowering women across the entire
  lifecycle, from first period to last. It combines an editorial content hub of expert-reviewed
  articles, videos, and clinical research with Clara, an AI-powered health companion built on
  thousands of real questions and reviewed by medical experts. The platform spans menstrual health,
  fertility, pregnancy, sexual health, general wellness, and condition management for PCOS,
  endometriosis, and related concerns, and works with 200+ health and wellness partners. Founded by
  Kristyn Hodgdon and Abby Mercado and backed by Techstars, Rescripted is a consumer-facing product
  with no public developer API, SDK, or developer portal at this time.
